<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТО сигнализации</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#c4301c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ТО">
<script src="supabase.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="web-config.js"></script>
<script src="push-config.js"></script>

<style>
:root{--bg:#f2f3ef;--card:#fff;--ink:#1a2429;--mut:#667378;--line:#dde0da;--red:#c4301c;--redt:#fff;--ok:#2b7a4b;--warn:#a8680f;--bad:#c4301c;--okb:#e1f1e7;--warnb:#f8ecd3;--badb:#f9e0dc;--newb:#e8eaec;--yb:#fff1b8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--card:#1d2428;--ink:#e8ecee;--mut:#8f9ca1;--line:#2c363b;--red:#e5533d;--ok:#5cc489;--warn:#e0a24a;--bad:#ff7d68;--okb:#17301f;--warnb:#33270f;--badb:#3a1c17;--newb:#262e32;--yb:#4a3d0c}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0;font-weight:600}
main{padding:0 16px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mut{color:var(--mut);font-size:14px}
.b{font-size:13px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b.ok{background:var(--okb);color:var(--ok)}.b.warn{background:var(--warnb);color:var(--warn)}.b.bad{background:var(--badb);color:var(--bad)}.b.new{background:var(--newb);color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:4px 0 12px}
label{font-size:14px;color:var(--mut)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:13px 16px;background:var(--red);color:var(--redt);width:100%;margin:0 0 8px}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:16px}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 auto;font:inherit;font-size:12px;background:none;border:0;color:var(--mut);padding:10px 2px;border-radius:8px}
nav button.on{color:var(--red);font-weight:600}
.back{background:none;border:0;color:var(--red);font:inherit;font-weight:500;padding:8px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));color:#ddd}.ov img{max-width:100%;max-height:76%;object-fit:contain}.ov .btn{width:auto;margin:10px 6px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 8px;padding:0 16px}.tabs button{flex:none;font:inherit;font-size:14px;padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.tabs button.on{background:var(--red);color:var(--redt);border-color:var(--red)}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{text-align:left;color:var(--mut);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}.tb td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}.tb tr.y td{background:var(--yb)}
.bell{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ink)}.bell.has{border-color:var(--red);color:var(--red);font-weight:600}
.toast{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:14px}
#role{max-width:55vw;text-align:right}
.sel{border:2px solid var(--red)!important}
</style>
</head>
<body>
<header><h1 id="ttl">Объекты</h1><span style="display:flex;gap:8px;align-items:center"><button class="bell" id="bell" style="display:none" onclick="go('notes')"></button><span class="b new" id="role" onclick="badgeClick()"></span></span></header>
<div id="err" class="card" style="display:none;margin:0 16px 10px"></div><div id="toast" class="toast" style="display:none"></div><main id="app"></main>
<nav>
<button data-t="list">Объекты</button>
<button data-t="reqs">Заявки</button>
<button data-t="journal">Журнал</button>
<button data-t="table">Отчёты</button>
</nav>
<script>
const SUPABASE_URL='https://maalpiizueoavabugkok.supabase.co',SUPABASE_KEY='sb_publishable_b3huP5hMBmDzn-8vlCmi0A_XnzCIyPL';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={objs:[],checks:[],photos:[],sinfo:[],reqs:[],notes:[],tech:''},DB=null,ADMIN=false,USER=null,STATUS='';
try{S.tech=localStorage.getItem('pozh-tech')||''}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SYS={
fire:{n:'ТО пожарной сигнализации и системы оповещения',s:'Сигнализация',items:['Приёмно-контрольный прибор','Дымовые и тепловые извещатели','Ручные извещатели','Шлейфы и кабельные линии','Резервное питание (АКБ)','Световые табло (оповещатели «Выход»)','Звуковые оповещатели (сирены)','Уровень звукового давления соответствует норме','Система оповещения и управления эвакуацией (СОУЭ)','СПИ (система передачи извещений)']},
water:{n:'ТО внутреннего противопожарного водопровода',s:'ВПВ',items:['Пожарные краны и шкафы (комплектность)','Пожарные рукава (состояние, скатка)','Стволы и вентили кранов','Запорная арматура и задвижки','Давление в сети','Пожарные насосы (пробный пуск)','Таблички и указатели','Свободный доступ к кранам']},
doors:{n:'ТО противопожарных дверей',s:'Двери',items:['Полотно и коробка (целостность)','Уплотнители и огнезащитные вставки','Петли и фурнитура','Доводчик (самозакрывание)','Замки и защёлки','Зазоры по периметру','Маркировка и паспортные таблички','Дверь не заблокирована в открытом виде']},
light:{n:'ТО аварийного освещения',s:'Освещение',items:['Светильники (работоспособность)','Автономное питание (АКБ)','Переход на аварийный режим','Время автономной работы','Указатели «Выход»','Целостность и чистота плафонов','Щиты и линии питания']},
video:{n:'ТО видеонаблюдения',s:'Видео',items:['Камеры (изображение, фокус)','Видеорегистратор','Жёсткие диски и глубина архива','Питание и блоки питания','Каналы связи и коммутаторы','Дата и время на регистраторе','Чистота объективов и крепления']},
voice:{n:'ТО системы речевого оповещения (антитеррор)',s:'Антитеррор',items:['Усилители и пульт управления','Громкоговорители (звучание, разборчивость)','Микрофон дежурного','Тестовое оповещение','Заготовленные сообщения','Резервное питание','Каналы связи']}};
const PER={1:'Ежемесячно',3:'Раз в квартал',12:'Раз в год'};
const fmt=d=>new Date(d).toLocaleDateString('ru-RU');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let v={t:'list',id:null,q:'',sys:'fire'};
const hist=(id,k)=>S.checks.filter(c=>c.oid===id&&c.system===(k||v.sys)).sort((a,b)=>b.date.localeCompare(a.date));
function dueDate(o){const l=hist(o.id)[0];if(!l)return null;const d=new Date(l.date);d.setMonth(d.getMonth()+Number((o.systems||{})[v.sys]||3));return d}
function st(o){const d=dueDate(o);if(!d)return['new','Не проверен',-1e9];const n=Math.ceil((d-new Date())/864e5);
if(n<0)return['bad','Просрочено '+(-n)+' дн.',n];if(n<=14)return['warn','Через '+n+' дн.',n];return['ok','До '+fmt(d),n]}
function go(t,id){v.t=t;v.id=id||null;if(t==='notes'){v.prevSeen=getSeen();markSeen()}if(t==='reqform')REQ_OBJ='';window.scrollTo(0,0);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='form'){v.id=null;v.pre=null}go(b.dataset.t,null)});

function tabsHtml(){return `<div class="tabs">${Object.keys(SYS).map(k=>`<button class="${k===v.sys?'on':''}" onclick="setSys('${k}')">${SYS[k].s}</button>`).join('')}</div>`}
function setSys(k){v.sys=k;render()}
function listHtml(){
const q=v.q.trim().toLowerCase(),m=sortOf('list');
const a=S.objs.filter(o=>o.systems&&o.systems[v.sys]&&((o.customer||'')+' '+o.name+' '+o.addr).toLowerCase().includes(q));
if(!S.objs.length)return '<div class="empty">'+(DB?(ADMIN?'Объектов пока нет.<br>Добавьте первый кнопкой «+ Новый объект».':'Объектов пока нет. Их добавляет администратор.'):STATUS)+'</div>';
if(!a.length)return '<div class="empty">'+(q?'Ничего не найдено':'К этой системе пока не привязан ни один объект'+(ADMIN?'.<br>Отметьте её в карточке объекта: «Изменить объект».':'.'))+'</div>';
const card=(o,withC)=>{const s=st(o);return `<button class="card" onclick="go('obj','${o.id}')">${withC&&!nameIsCust(o)?`<div class="mut" style="font-weight:600">${esc(o.customer||'Без заказчика')}</div>`:''}<div class="row"><b>${esc(o.name)}</b><span class="b ${s[0]}">${s[1]}</span></div><div class="mut">${esc(o.addr)}</div></button>`};
if(m==='date')return a.sort((x,y)=>st(x)[2]-st(y)[2]||oLab(x).localeCompare(oLab(y))).map(o=>card(o,true)).join('');
const g={},NO='Без заказчика';a.forEach(o=>(g[o.customer||NO]=g[o.customer||NO]||[]).push(o));
const ks=Object.keys(g).sort((x,y)=>(x===NO)-(y===NO)||x.localeCompare(y));
return ks.map(k=>{const os=g[k].sort((x,y)=>x.name.localeCompare(y.name)),solo=os.length===1&&nameIsCust(os[0]);
return (solo?'':`<div class="mut" style="margin:14px 0 6px;font-weight:600">${esc(k)}</div>`)+os.map(o=>card(o,false)).join('')}).join('')}
function vList(){return `${tabsHtml()}<div class="mut" style="margin:0 0 8px">${SYS[v.sys].n}</div>${sortBar('list')}${ADMIN?`<div style="display:flex;gap:8px;margin:0 0 10px"><button class="btn s" style="margin:0" onclick="newObj()">+ Новый объект</button><button class="btn s" style="margin:0" onclick="go('import')">Импорт из Excel</button></div>`:''}<input type="search" id="q" placeholder="Поиск по названию или адресу" value="${esc(v.q)}"><div id="lst">${listHtml()}</div>`}

const yearsIn=(o,d)=>o.year_in?(d?Number(d.slice(0,4)):new Date().getFullYear())-o.year_in:0;
const techs=c=>esc(c.tech)+(c.tech2?', '+esc(c.tech2):'');
const actBadge=c=>`<span class="b ${c.act_signed?'ok':'bad'}">${c.act_signed?'Акт подписан':'Акт не подписан'}</span>`;
const actBtn=c=>c.act_signed?'':`<button class="btn s" style="margin:8px 0 0;padding:9px" onclick="setAct('${c.id}',true)">Отметить: акт подписан</button>`;
const lifeB='<span class="b warn">Превышен предельный срок службы</span>';
const techList=()=>[...new Set(S.checks.flatMap(c=>[c.tech,c.tech2]).filter(Boolean))];
function monthsList(sel){const a=new Set(S.checks.map(c=>c.date.slice(0,7)));a.add(today().slice(0,7));if(sel)a.add(sel);return [...a].sort().reverse()}
function monthSel(key,val,all){return `<select onchange="v['${key}']=this.value;render()">${all?'<option value="">Все месяцы</option>':''}${monthsList(val).map(m=>`<option value="${m}" ${m===val?'selected':''}>${mLabel(m)}</option>`).join('')}</select>`}
async function setAct(id,val){await enqueue({type:'act',id,val})}
const nameIsCust=o=>!!(o.customer&&String(o.customer).trim().toLowerCase()===String(o.name).trim().toLowerCase());
const oLab=o=>(o.customer&&!nameIsCust(o)?o.customer+' · ':'')+o.name;
const EQ={fire:[['ps','ПС'],['soue','СОУЭ'],['spi','СПИ']]};
const eqRows=k=>EQ[k]||[['main','']];
const eqL=(k,x)=>k==='fire'?['Тип оборудования '+x,'Количество единиц ('+x+')']:['Тип и модель оборудования','Количество единиц оборудования'];
const sinfo=(oid,k)=>S.sinfo.find(x=>x.object_id===oid&&x.system===k)||{};
function sinfoHtml(o){const i=sinfo(o.id,v.sys),eq=i.equipment||{},y=yearsIn(i);
return `<div class="card"><div class="row"><b>Данные системы</b><button class="back" style="padding:0" onclick="go('sinfo','${o.id}')">Изменить</button></div>
<div class="mut">Проектная документация: ${i.project_no?'№ '+esc(i.project_no):'не указана'}</div>
<div class="mut">Введена в эксплуатацию: ${i.year_in?i.year_in+' г. ('+y+' лет)':'не указано'}</div>
${y>10?`<div style="margin:6px 0">${lifeB}</div>`:''}
${eqRows(v.sys).map(([k,x])=>{const e=eq[k]||{},L=eqL(v.sys,x);return `<div class="mut">${L[0]}: ${e.type?esc(e.type):'не указан'}. ${L[1]}: ${e.qty?esc(e.qty):'не указано'}</div>`}).join('')}</div>`}
function vSinfo(){const o=S.objs.find(x=>x.id===v.id),i=sinfo(o.id,v.sys),eq=i.equipment||{};
return `<button class="back" onclick="go('obj','${o.id}')">‹ ${esc(oLab(o))}</button><div class="mut" style="margin:0 0 8px">${SYS[v.sys].n}</div>
<label>№ проектной документации</label><input id="si_pno" value="${esc(i.project_no)}">
<label>Год ввода в эксплуатацию</label><input id="si_year" value="${esc(i.year_in)}" inputmode="numeric" maxlength="4" placeholder="Например, 2012">
${eqRows(v.sys).map(([k,x])=>{const e=eq[k]||{},L=eqL(v.sys,x);return `<label>${L[0]}</label><input class="si_t" data-k="${k}" value="${esc(e.type)}"><label>${L[1]}</label><input class="si_q" data-k="${k}" value="${esc(e.qty)}" inputmode="numeric">`}).join('')}
<button class="btn" onclick="saveSinfo('${o.id}')">Сохранить</button>`}
async function saveSinfo(oid){const y=$('#si_year').value.trim(),yr=y?Number(y):null;
if(yr!==null&&!(yr>=1950&&yr<=new Date().getFullYear())){alert('Год ввода: четыре цифры, например 2012');return}
const equipment={};document.querySelectorAll('.si_t').forEach(e=>{equipment[e.dataset.k]={type:e.value.trim(),qty:''}});document.querySelectorAll('.si_q').forEach(e=>{equipment[e.dataset.k].qty=e.value.trim()});
await enqueue({type:'sinfo',row:{object_id:oid,system:v.sys,project_no:$('#si_pno').value.trim(),year_in:yr,equipment,updated_at:new Date().toISOString()}});go('obj',oid)}
function newObj(){v.id=null;v.pre=null;go('form',null)}
function newFor(id){const o=S.objs.find(x=>x.id===id);v.pre={customer:o.customer||'',contact:o.contact||'',phone:o.phone||''};go('form',null)}
function vForm(){if(!ADMIN)return '<div class="empty">Добавлять и менять объекты может только администратор</div>';const o=S.objs.find(x=>x.id===v.id)||Object.assign({name:'',addr:'',customer:'',contact:'',phone:'',systems:{},notes:''},v.pre||{});
return `<button class="back" onclick="${v.id?`go('obj',v.id)`:`go('list')`}">‹ Назад</button>
<label>Заказчик</label><input id="f_cust" list="cl" value="${esc(o.customer)}" placeholder="Например, МУП ОК и ТС"><datalist id="cl">${[...new Set(S.objs.map(x=>x.customer).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
<label>Название объекта *</label><input id="f_name" value="${esc(oLab(o))}" placeholder="Например, Котельная №1">
<label>Адрес *</label><input id="f_addr" value="${esc(o.addr)}">
<label>Контактное лицо</label><input id="f_contact" value="${esc(o.contact)}">
<label>Телефон</label><input id="f_phone" value="${esc(o.phone)}" type="tel" inputmode="tel">
<label style="color:var(--ink);font-weight:600">Системы на объекте и периодичность ТО</label>
${Object.keys(SYS).map(k=>`<label>${SYS[k].n.slice(3)}</label><select class="fs" data-k="${k}"><option value="0">нет на объекте</option>${Object.keys(PER).map(p=>`<option value="${p}" ${(o.systems||{})[k]==p?'selected':''}>${PER[p]}</option>`).join('')}</select>`).join('')}
<label>Заметки (доступ, ключи, особенности)</label><textarea id="f_notes" rows="3">${esc(o.notes)}</textarea>
<button class="btn" onclick="saveObj()">Сохранить объект</button>`}
async function saveObj(){
const g=i=>$('#f_'+i).value.trim();
if(!g('name')||!g('addr')){alert('Укажите название и адрес объекта');return}
const systems={};document.querySelectorAll('.fs').forEach(e=>{if(Number(e.value))systems[e.dataset.k]=Number(e.value)});
if(!Object.keys(systems).length){alert('Отметьте хотя бы одну систему на объекте');return}
const d={customer:g('cust'),name:g('name'),addr:g('addr'),contact:g('contact'),phone:g('phone'),systems,notes:g('notes')};
if(!DB||!ADMIN){alert('Нет прав или нет связи с базой');return}
if(!needOnline())return;
const r=v.id?await sb.from('objects').update(d).eq('id',v.id).select().single():await sb.from('objects').insert(d).select().single();
if(r.error){alert('Ошибка записи: '+r.error.message);return}
v.pre=null;await load();go('obj',r.data.id)}

function vObj(){const o=S.objs.find(x=>x.id===v.id);if(!o){return vList()}
const ks=Object.keys(SYS).filter(k=>o.systems&&o.systems[k]);if(ks.length&&!ks.includes(v.sys))v.sys=ks[0];
const s=st(o),h=hist(o.id);
return `<button class="back" onclick="go('list')">‹ Объекты</button>
<div class="tabs">${ks.map(k=>`<button class="${k===v.sys?'on':''}" onclick="setSys('${k}')">${SYS[k].s}</button>`).join('')}</div><div class="mut" style="margin:0 0 8px">${SYS[v.sys].n}</div>
<div class="card"><div class="row"><b>${esc(oLab(o))}</b><span class="b ${s[0]}">${s[1]}</span></div>
<div class="mut">${esc(o.addr)}</div>
${o.contact?`<p>${esc(o.contact)}</p>`:''}
${o.phone?`<p>Тел.: <a href="tel:${esc(o.phone.replace(/[^0-9+]/g,''))}" style="color:var(--red)">${esc(o.phone)}</a></p>`:''}
<div class="mut">Периодичность ТО: ${PER[o.systems&&o.systems[v.sys]]||''}</div>
${o.notes?`<p class="mut">${esc(o.notes)}</p>`:''}</div>

const IDB=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('pozh',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('outbox',{keyPath:'seq',autoIncrement:true})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
return{get:k=>tx('kv','readonly',o=>o.get(k)),set:(k,x)=>tx('kv','readwrite',o=>o.put(x,k)),all:()=>tx('outbox','readonly',o=>o.getAll()),add:x=>tx('outbox','readwrite',o=>o.add(x)),put:x=>tx('outbox','readwrite',o=>o.put(x)),del:k=>tx('outbox','readwrite',o=>o.delete(k))}})();
let BASE={objs:[],checks:[],photos:[],sinfo:[],reqs:[],notes:[]},OB=[],ONLINE=true,flushing=false;
function mergeView(){
const checks=BASE.checks.map(c=>Object.assign({},c)),photos=BASE.photos.slice(),sinfo=BASE.sinfo.map(x=>Object.assign({},x)),reqs=BASE.reqs.map(r=>Object.assign({},r));
const cid=new Set(checks.map(c=>c.id)),pid=new Set(photos.map(p=>p.id));
const addP=(p,at)=>{if(!pid.has(p.ph.id))photos.push(Object.assign({},p.ph,{_pending:1,created_at:at}))};
for(const it of OB){
if(it.type==='check'){if(!cid.has(it.id))checks.push(Object.assign({},it.row,{id:it.id,oid:it.row.object_id,_pending:1}));(it.photos||[]).forEach(p=>addP(p,it.at))}
else if(it.type==='photo')addP(it,it.at);
else if(it.type==='act'){const c=checks.find(x=>x.id===it.id);if(c)c.act_signed=it.val}
else if(it.type==='reqnew'){if(!reqs.some(x=>x.id===it.id))reqs.push(Object.assign({status:'open',created_at:it.at,object_id:null,system:null,to_role:'tech'},it.row,{id:it.id,_pending:1}))}
else if(it.type==='reqdone'){const r=reqs.find(x=>x.id===it.id);if(r&&r.status==='open'){r.status='done';r.done_at=it.at;r.done_by_name=it.tname;r.done_comment=it.cmt;r._pending=1}}
else if(it.type==='sinfo'){const i=sinfo.findIndex(x=>x.object_id===it.row.object_id&&x.system===it.row.system);if(i>=0)sinfo[i]=Object.assign({},sinfo[i],it.row);else sinfo.push(Object.assign({},it.row))}}
S.objs=BASE.objs;S.checks=checks;S.photos=photos;S.sinfo=sinfo;S.reqs=reqs;
const live=new Set(reqs.map(r=>r.id)),fin=new Set(reqs.filter(r=>r.status==='done').map(r=>r.id));
S.notes=BASE.notes.filter(n=>!((n.kind==='request'||n.kind==='request_admin')&&n.ref_id&&(fin.has(n.ref_id)||(reqs.length&&!live.has(n.ref_id)))))}
async function enqueue(it){it.at=new Date().toISOString();const k=await IDB.add(it);it.seq=k;OB.push(it);mergeView();refresh();flush()}
let notesReady=false;
async function load(){if(!USER)return;
try{const [o,c,ph,pr,si,rq,nt]=await Promise.all([sb.from('objects').select('*').order('name'),sb.from('checks').select('*'),sb.from('photos').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('role').eq('id',USER.id).single(),sb.from('system_info').select('*'),sb.from('requests').select('*').order('created_at',{ascending:false}),sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50)]);
const er=o.error||c.error||ph.error||si.error||rq.error||nt.error;
if(er){if(isNet(er)){ONLINE=false;refresh();return}showErr(er.message||er.code||'неизвестная ошибка');refresh();return}
ONLINE=true;const was=ADMIN;if(pr.data)ADMIN=pr.data.role==='admin';
const known=new Set(BASE.notes.map(n=>n.id));
BASE={objs:o.data,photos:ph.data,sinfo:si.data,reqs:rq.data,notes:nt.data,checks:c.data.map(r=>Object.assign({},r,{oid:r.object_id,system:r.system||'fire'}))};
try{await IDB.set('cache',Object.assign({},BASE,{admin:ADMIN,uid:USER.id}))}catch(e){}
mergeView();showErr('');if(notesReady)announce(nt.data.filter(n=>!known.has(n.id)));notesReady=true;syncToken();if(was!==ADMIN)render();else refresh()
}catch(e){ONLINE=false;refresh()}}
async function ensureAuth(){try{const r=await sb.auth.getSession();if(r.data&&r.data.session)return'ok';if(r.error&&isNet(r.error))return'net';return'login'}catch(e){return'net'}}
async function upPhoto(p){const st=sb.storage.from('journal');
for(const [path,blob] of [[p.ph.path,p.blob],[tp(p.ph.path),p.thumb]]){const r=await st.upload(path,blob,{contentType:'image/jpeg'});
if(r.error&&!/already exists|duplicate/i.test(r.error.message||'')&&String(r.error.statusCode)!=='409')return errR(r.error)}
const r=await sb.from('photos').insert(p.ph);if(r.error&&r.error.code!=='23505')return errR(r.error);return null}
async function runOp(it){try{
if(it.type==='check'){const r=await sb.from('checks').insert(Object.assign({id:it.id},it.row));if(r.error&&r.error.code!=='23505')return errR(r.error);
for(const p of it.photos||[]){if(p.done)continue;const e=await upPhoto(p);if(e)return e;p.done=true;await IDB.put(it)}return{ok:1}}
if(it.type==='reqnew'){const r=await sb.from('requests').insert(Object.assign({id:it.id},it.row));if(r.error&&r.error.code!=='23505')return errR(r.error);return{ok:1}}
if(it.type==='reqdone'){const r=await sb.rpc('complete_request',{rid:it.id,tname:it.tname,cmt:it.cmt,at:it.at});return r.error?errR(r.error):{ok:1}}
if(it.type==='photo'){const e=await upPhoto(it);return e||{ok:1}}
if(it.type==='act'){const r=await sb.rpc('set_act',{cid:it.id,signed:it.val});return r.error?errR(r.error):{ok:1}}
if(it.type==='sinfo'){const r=await sb.from('system_info').upsert(it.row,{onConflict:'object_id,system'});return r.error?errR(r.error):{ok:1}}
return{err:'неизвестная запись'}}catch(e){return errR(e)}}
let again=false;
async function flush(){if(flushing){again=true;return}if(!USER||!OB.length)return;flushing=true;
try{const a=await ensureAuth();
if(a==='net'){ONLINE=false;return}
if(a==='login'){USER=null;DB=null;STATUS='Нужно войти заново. Записи сохранены на телефоне и отправятся после входа.';render();return}
for(const it of [...OB]){if(it.err)continue;const r=await runOp(it);
if(r.net){ONLINE=false;break}
ONLINE=true;
if(r.ok){await IDB.del(it.seq);OB=OB.filter(x=>x.seq!==it.seq)}else{it.err=r.err;await IDB.put(it)}}
}finally{flushing=false}
mergeView();refresh();if(ONLINE)await load();if(again){again=false;flush()}}

function impBuild(rows){const H=(rows[0]||[]).map(x=>String(x).trim().toLowerCase()),ix=k=>H.findIndex(h=>h.includes(k));

const cell=(r,i)=>i<0||r[i]==null?'':String(r[i]).trim();
const have=new Set(S.objs.map(o=>((o.customer||'')+'|'+o.addr).toLowerCase())),seen=new Set(),cnt={},list=[],canon={},exist={};

async function saveReq(){const b=$('#r_body').value.trim();

const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function photoBlob(p){const lu=localBlob(p.path,'big');

async function savePhotos(ids){const C=window.Capacitor,P=window.NativePlugins||(C&&C.Plugins)||{};
try{const ps=ids.map(id=>S.photos.find(x=>x.id===id)).filter(Boolean);if(!ps.length)return;

if(P.Filesystem&&P.Share){const uris=[];
for(let i=0;i<blobs.length;i++){const r=await P.Filesystem.writeFile({path:'zhurnal-'+Date.now()+'-'+(i+1)+'.jpg',data:await blobB64(blobs[i]),directory:'CACHE'});uris.push(r.uri)}
await P.Share.share({title:'Фото журнала',dialogTitle:'Сохранить или отправить фото',files:uris});return}
const files=blobs.map((b,i)=>new File([b],'zhurnal-'+(i+1)+'.jpg',{type:'image/jpeg'}));
if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}

}catch(e){if(e&&/cancel|abort/i.test(String(e.message||e)))return;alert('Не удалось сохранить фото: '+(e.message||e))}}
let PUSH_TOKEN=null,PUSH_STATE='',PUSH_INIT=false,PUSH_ERR='';
const isNative=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||!!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
const webCfg=()=>{const c=window.FIREBASE_WEB;return c&&c.projectId&&window.VAPID_KEY?c:null};
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector('script[data-lz="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.setAttribute('data-lz',src);s.onload=res;s.onerror=()=>rej(new Error('не загрузился '+src));document.head.appendChild(s)});
function pushLine(){const web=!isNative();
const m={on:'включены',denied:'нет разрешения (разрешите уведомления для приложения в настройках телефона)',error:'ошибка подключения'+(PUSH_ERR?': '+esc(PUSH_ERR):''),na:'недоступны в этой версии приложения',nofb:'не настроены: при сборке не найден файл Firebase (секрет GOOGLE_SERVICES_JSON)',
nowebcfg:'не настроены: в веб-версии не заполнен файл web-config.js',webna:'этот браузер их не поддерживает',ioshome:'сначала добавьте приложение на экран «Домой»: в Safari нажмите «Поделиться», затем «На экран Домой», откройте приложение с главного экрана и вернитесь сюда'};
const t=PUSH_STATE?m[PUSH_STATE]:(web?'выключены':'подключаются…');
const btn=web&&PUSH_STATE!=='on'&&PUSH_STATE!=='webna'&&PUSH_STATE!=='nowebcfg'?`<button class="btn" style="margin:8px 0 0" onclick="enableWebPush()">Включить уведомления</button>`:'';
const again=!web&&isNative()&&PUSH_STATE!=='on'?'<a href="#" onclick="initPush(true);return false" style="color:var(--red)">Подключить снова</a>':'';
return `<div class="mut" style="margin:0 0 10px">Push-уведомления на этом телефоне: ${t}. ${again}${btn}</div>`}
async function syncToken(){if(!PUSH_TOKEN||!USER||!ONLINE)return;
try{const r=await sb.from('push_tokens').upsert({token:PUSH_TOKEN,user_id:USER.id},{onConflict:'token'});
if(!r.error)PUSH_STATE='on';else if(!isNet(r.error)){PUSH_STATE='error';PUSH_ERR=r.error.message||''}}catch(e){}}
async function dropToken(){try{if(PUSH_TOKEN&&USER)await Promise.race([sb.from('push_tokens').delete().eq('token',PUSH_TOKEN),new Promise(r=>setTimeout(r,2500))])}catch(e){}}
const notesRefresh=()=>{if(v.t==='notes')render()};
async function enableWebPush(silent){const cfg=webCfg();
if(!cfg){PUSH_STATE='nowebcfg';notesRefresh();return}
if(typeof Notification==='undefined'||!('serviceWorker' in navigator)){PUSH_STATE='webna';notesRefresh();return}
if(isIOS()&&!isStandalone()){PUSH_STATE='ioshome';notesRefresh();return}
try{await loadScript('web.js');
if(!(await window.WebPush.supported())){PUSH_STATE='webna';notesRefresh();return}
if(Notification.permission!=='granted'){if(silent)return;const p=await Notification.requestPermission();if(p!=='granted'){PUSH_STATE='denied';notesRefresh();return}}
const reg=await navigator.serviceWorker.ready;
PUSH_TOKEN=await window.WebPush.token(cfg,window.VAPID_KEY,reg);
window.WebPush.onMessage(cfg,()=>pollLite());
await syncToken();notesRefresh()}catch(e){PUSH_STATE='error';PUSH_ERR=String((e&&e.message)||e);notesRefresh()}}
async function initPush(force){
if(!isNative()){if(!USER)return;
if(!webCfg()){PUSH_STATE='nowebcfg';return}
if(typeof Notification==='undefined'||!('serviceWorker' in navigator)){PUSH_STATE='webna';return}
if(Notification.permission==='granted')enableWebPush(true);
else if(Notification.permission==='denied')PUSH_STATE='denied';
return}
const PN=(window.NativePlugins||{}).PushNotifications;
if(!PN){PUSH_STATE='na';return}
if(window.PUSH_ENABLED!==true){PUSH_STATE='nofb';return}
if(!USER||(PUSH_INIT&&!force))return;PUSH_INIT=true;
try{let p=await PN.checkPermissions();if(p.receive!=='granted')p=await PN.requestPermissions();
if(p.receive!=='granted'){PUSH_STATE='denied';return}
if(!initPush.l){initPush.l=1;
PN.addListener('registration',t=>{PUSH_TOKEN=t.value;syncToken()});
PN.addListener('registrationError',e=>{PUSH_STATE='error';PUSH_ERR=(e&&e.error)||''});
PN.addListener('pushNotificationReceived',()=>{pollLite()});
PN.addListener('pushNotificationActionPerformed',a=>{const d=(a.notification&&a.notification.data)||{};
if(d.kind==='fault'&&d.object_id){if(d.system)v.sys=d.system;go('obj',d.object_id)}else go('reqs');pollLite()})}
await PN.register()}catch(e){PUSH_STATE='error';PUSH_ERR=String((e&&e.message)||e)}}
if(!isNative()&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
const delBtn=c=>(ADMIN&&!c._pending)?`<button class="btn d" style="margin:8px 0 0;padding:9px" onclick="event.stopPropagation();delCheck('${c.id}')">Удалить проверку и её фото</button>`:'';
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
async function purge(checkIds,photoRows,mode){
const st=sb.storage.from('journal'),paths=[];photoRows.forEach(p=>{paths.push(p.path,tp(p.path))});
for(const b of chunk(paths,100)){const r=await st.remove(b);if(r.error)throw r.error}
if(mode==='photos'){for(const b of chunk(photoRows.map(p=>p.id),100)){const r=await sb.from('photos').delete().in('id',b);if(r.error)throw r.error}}
else{for(const b of chunk(photoRows.filter(p=>!checkIds.includes(p.check_id)).map(p=>p.id),100)){const r=await sb.from('photos').delete().in('id',b);if(r.error)throw r.error}
for(const b of chunk(checkIds,100)){let r=await sb.from('notifications').delete().in('ref_id',b);if(r.error)throw r.error;r=await sb.from('checks').delete().in('id',b);if(r.error)throw r.error}}}
async function delCheck(id){const c=S.checks.find(x=>x.id===id);if(!c||!ADMIN||!needOnline())return;

function vCleanup(){if(!ADMIN)return '<div class="empty">Только для администратора</div>';

return `<button class="back" onclick="go('journal')">‹ Журнал</button>
<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Удаление необратимо</b><div class="mut">Удалённые проверки и фото восстановить нельзя. Перед удалением можно скопировать журнал в CSV (кнопка на вкладке «Журнал») и сохранить нужные фото на телефон.</div></div>
<label>Период</label>${sel('kind',[['month','Месяц'],['year','Год']],o.kind)}

<label>Что удалить</label>${sel('mode',[['all','Проверки вместе с фото'],['photos','Только фото (проверки остаются)']],o.mode)}
<div class="card"><b>Будет удалено:</b><div>Проверок: ${o.mode==='photos'?0:m.cs.length}</div><div>Фото: ${m.ph.length}</div></div>
<button class="btn d" ${(o.mode==='photos'?m.ph.length:m.cs.length+m.ph.length)?'':'disabled'} onclick="doCleanup()">Удалить</button>`}
async function doCleanup(){if(!ADMIN||!needOnline())return;const o=cuSel(),m=cuMatch();
const nC=o.mode==='photos'?0:m.cs.length,what=(o.kind==='year'?o.val+' год':mLabel(o.val))+', '+(o.sys?sysS(o.sys):'все системы');
